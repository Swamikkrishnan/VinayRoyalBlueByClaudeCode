<svg xmlns="http://www.w3.org/2000/svg" width="430" height="150" viewBox="0 0 430 150" fill="none">
<defs>
<filter id="blueGlow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="6" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="goldGlow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="4" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<linearGradient id="blueFade" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#5DB8F0" stop-opacity="0"/>
  <stop offset=".5" stop-color="#5DB8F0" stop-opacity=".7"/>
  <stop offset="1" stop-color="#5DB8F0" stop-opacity="0"/>
</linearGradient>
</defs>

<g transform="translate(0 150) scale(1 -1)" opacity=".8">
 <path d="M0 112 C80 62, 140 54, 208 74 C276 94, 336 76, 430 24" stroke="#C8A15A" stroke-width="1.3"/>
 <path d="M0 99 C88 48, 148 48, 216 69 C280 89, 343 66, 430 13" stroke="#5DB8F0" stroke-opacity=".18"/>
 <circle cx="215" cy="70" r="3" fill="#5DB8F0" filter="url(#blueGlow)"/>
</g>
</svg>