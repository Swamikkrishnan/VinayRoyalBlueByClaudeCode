</filter>
<linearGradient id="blueFade" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#5DB8F0" stop-opacity="0"/>
  <stop offset=".5" stop-color="#5DB8F0" stop-opacity=".7"/>
  <stop offset="1" stop-color="#5DB8F0" stop-opacity="0"/>
</linearGradient>
</defs>

<g opacity=".78">
  <path d="M0 145 C240 85, 470 58, 705 88 C885 110, 1025 120, 1200 74 C1350 35, 1490 28, 1600 18"
        stroke="#C8A15A" stroke-width="1.5"/>
